server {
    listen 80;
    server_name localhost;
    root /var/www/html;

    index index.php index.html;

    location / {
		try_files $uri $uri/ /index.php?$args;
    }

	location ~ ^/([^/]+)/ {
		try_files $uri $uri/ /$1/index.php?$args;
	}

		#   location /master/ {
		# try_files $uri $uri/ /master/index.php?$args;
		#   }
		#   location /sandbox/ {
		# try_files $uri $uri/ /sandbox/index.php?$args;
		#   }
		#   location /bbo/ {
		# try_files $uri $uri/ /bbo/index.php?$args;
		#   }
		#   location /koishow/ {
		# try_files $uri $uri/ /koishow/index.php?$args;
		#   }
		#   location /Esoftplay-Project-PKL/ {
		# try_files $uri $uri/ /Esoftplay-Project-PKL/index.php?$args;
		#   }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
